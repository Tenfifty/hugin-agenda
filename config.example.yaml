# ~/.config/hugin/agenda.yaml  (agenda-specific)
# ----------------------------------------------------------------
# Shared fields (language, vault_path, journal_path, gws_bin,
# archive_dirname, ...) live in ~/.config/hugin/hugin.yaml — see the
# `hugin` package for the canonical example. Run `hugin-init` to
# scaffold both files.

agenda:
  # Agenda templates. Defaults to English templates shipped with the package.
  # Point at your own dir to use custom templates (e.g. Swedish, personal).
  # templates_dir: ~/Documents/notes/agenda_templates

  # Base template name. Resolves to <templates_dir>/agenda_<base_template>.md.
  # Per-day variation lives in `## Additions` / `## Removals` in gtd.md, not
  # in extra template files.
  # base_template: base

  # GTD file with weekly tasks plus overlays. Expected structure:
  #   ## Week
  #   ### Monday
  #   - [ ] task
  #       - [ ] subitem  (each subitem adds a 30m slot)
  #
  #   ## Additions                       # or "Tillägg" for sv
  #   - [ ] One-off task `2026-06-17`
  #   - [ ] Take out recycling `{every_n_days_from: [2026-01-07, 28]}`
  #   ### Office `{weekdays: [mon, thu]}`  # named section, --override Office
  #   - [ ] Shorter cleanup, 20m
  #
  #   ## Removals                        # or "Borttagningar" for sv
  #   - Standup `2026-07-01..2026-07-21` # substring match against agenda lines
  # gtd_path: ~/Documents/notes/gtd.md

  # Override the overlay section headings (default: follows `language`).
  # additions_heading: Additions
  # removals_heading: Removals

  # Google Calendar id to read (default "primary")
  calendar_id: primary

  # Scheduling: 30-minute slots starting at 09:00 by default
  task_slot_minutes: 30
  day_start_hour: 9

  # Override weekday names used to find the right day in gtd.md. By default
  # they come from the shared `language` field (en/sv supported out of box).
  # weekday_names:
  #   - Monday
  #   - Tuesday
  #   - Wednesday
  #   - Thursday
  #   - Friday
  #   - Saturday
  #   - Sunday
