[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hugin-agenda"
version = "0.1.0"
description = "Generate a daily agenda from calendar + GTD. Part of the Hugin personal productivity stack."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "David Fendrich" }]
dependencies = [
    "hugin",
]

[project.scripts]
hugin-agenda = "hugin_agenda.agenda:main"
hugin-agenda-rotate-journal = "hugin_agenda.rotate_journal:main"
hugin-agenda-sync-gtd-checkbox = "hugin_agenda.sync_gtd_checkbox:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hugin_agenda = ["templates/*.md"]
